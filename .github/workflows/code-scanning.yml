name: Code scanning

# CodeQL på PR-er, på main og ukentlig. Funn vises under Security → Code scanning.
# Gratis for offentlige repo; private repo krever GitHub Code Security.
# Code scanning i repoet må stå på «Advanced» (denne filen), ikke «Default setup».

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # mandager 04:17 UTC

permissions:
  contents: read

concurrency:
  group: code-scanning-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # last opp funnene
    strategy:
      fail-fast: false
      matrix:
        # TILPASS: legg til språkene i repoet, f.eks. javascript-typescript, python, go, java-kotlin.
        # «actions» analyserer workflowene og passer i alle repo.
        language: [actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
